services:
  # -----------------------------------------------------
  # 🗄️ PostgreSQL Database
  # -----------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: upload_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: upload_service
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ expects the volume mounted at the parent directory, not
      # /var/lib/postgresql/data directly — it manages a major-version-namespaced
      # subdirectory underneath itself (pg_ctlcluster-style), and refuses to start
      # against a directly-mounted .../data path even on a fresh, empty volume.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - backend

  # -----------------------------------------------------
  # 🟢 PgBouncer (Connection Pooler)
  # -----------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: upload_pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:5432" # Host:Container - PgBouncer listens on 5432 inside container
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: upload_service
      AUTH_TYPE: scram-sha-256 # Match PostgreSQL 18's default auth method
      POOL_MODE: transaction # 🔑 best for microservices
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 20
      SERVER_IDLE_TIMEOUT: 60
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - backend

  # -----------------------------------------------------
  # 🔧 PgAdmin (PostgreSQL UI - Development Only)
  # -----------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: upload_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - backend
    profiles:
      - dev # Only start with --profile dev

  # -----------------------------------------------------
  # 🔴 Redis (Cache & Session Store)
  # -----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: upload_redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - backend

  # -----------------------------------------------------
  # 🔴 RedisInsight (Redis UI - Development Only)
  # -----------------------------------------------------
  redisinsight:
    image: redis/redisinsight:latest
    container_name: upload_redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - backend
    profiles:
      - dev # Only start with --profile dev

  # -----------------------------------------------------
  # 🌱 SeaweedFS (Distributed, S3-compatible object storage)
  # -----------------------------------------------------
  # No license required (Apache 2.0). Topology: one master (coordinates
  # topology/metadata), three volume servers (actual data, spread across
  # them by the master), one filer (POSIX-like layer the S3 gateway sits on),
  # one s3 gateway (the API our app actually talks to).
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: upload_seaweedfs_master
    hostname: seaweedfs-master
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0 -mdir=/data"
    volumes:
      - seaweedfs_master_data:/data
    ports:
      - "9333:9333" # Master UI — cluster topology, volumes, replication status
    restart: unless-stopped
    networks:
      - backend

  seaweedfs-volume1:
    image: chrislusf/seaweedfs:latest
    container_name: upload_seaweedfs_volume1
    hostname: seaweedfs-volume1
    command: "volume -ip=seaweedfs-volume1 -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080 -dir=/data"
    volumes:
      - seaweedfs_volume1_data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped
    networks:
      - backend

  seaweedfs-volume2:
    image: chrislusf/seaweedfs:latest
    container_name: upload_seaweedfs_volume2
    hostname: seaweedfs-volume2
    command: "volume -ip=seaweedfs-volume2 -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080 -dir=/data"
    volumes:
      - seaweedfs_volume2_data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped
    networks:
      - backend

  seaweedfs-volume3:
    image: chrislusf/seaweedfs:latest
    container_name: upload_seaweedfs_volume3
    hostname: seaweedfs-volume3
    command: "volume -ip=seaweedfs-volume3 -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080 -dir=/data"
    volumes:
      - seaweedfs_volume3_data:/data
    depends_on:
      - seaweedfs-master
    restart: unless-stopped
    networks:
      - backend

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: upload_seaweedfs_filer
    hostname: seaweedfs-filer
    command: "filer -ip=seaweedfs-filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0 -defaultStoreDir=/data"
    volumes:
      - seaweedfs_filer_data:/data
    ports:
      - "8888:8888" # Filer UI — browse buckets/files directly
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume1
      - seaweedfs-volume2
      - seaweedfs-volume3
    restart: unless-stopped
    networks:
      - backend

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: upload_seaweedfs_s3
    hostname: seaweedfs-s3
    command: "s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=8333"
    environment:
      # Read directly by the S3 gateway as the single-credential auth pair —
      # kept as minioadmin/minioadmin to match S3_ACCESS_KEY/S3_SECRET_KEY
      # already used everywhere else in this file, so no app env changes needed.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8333:8333"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume1
      - seaweedfs-volume2
      - seaweedfs-volume3
      - seaweedfs-filer
    restart: unless-stopped
    networks:
      - backend

  # -----------------------------------------------------
  # 🟡 Elasticsearch (Log Aggregation & Search)
  # -----------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: upload_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - backend

  # -----------------------------------------------------
  # 🟣 Kibana (Elasticsearch UI - Development Only)
  # -----------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: upload_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - backend
    profiles:
      - dev # Only start with --profile dev

  # -----------------------------------------------------
  # 🔄 Database Migration Service
  # -----------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: upload_migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:password@postgres:5432/upload_service
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://seaweedfs-s3:8333 # Internal Docker network
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: uploads
      S3_REGION: us-east-1
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTIC_USERNAME: elastic
      ELASTIC_PASSWORD: changeme
    volumes:
      - ./drizzle.config.ts:/app/drizzle.config.ts:ro
      - ./drizzle:/app/drizzle:ro
    command: sh -c "bunx drizzle-kit push"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - backend
    restart: "no"
    profiles:
      - migrate

  # -----------------------------------------------------
  # 🔵 Bun Backend Service
  # -----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: upload_backend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

      # 🔑 Database (via PgBouncer)
      DATABASE_URL: postgres://postgres:password@pgbouncer:5432/upload_service

      # 🔴 Redis
      REDIS_URL: redis://redis:6379

      # 🌱 SeaweedFS (S3 compatible)
      S3_ENDPOINT: http://seaweedfs-s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: uploads
      S3_STAGING_BUCKET: uploads-staging
      S3_REGION: us-east-1

      # 🟡 Elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTIC_USERNAME: elastic
      ELASTIC_PASSWORD: changeme

    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# -----------------------------------------------------
# 📦 Named Volumes (Persistent Data)
# -----------------------------------------------------
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local
  redisinsight_data:
    driver: local
  seaweedfs_master_data:
    driver: local
  seaweedfs_volume1_data:
    driver: local
  seaweedfs_volume2_data:
    driver: local
  seaweedfs_volume3_data:
    driver: local
  seaweedfs_filer_data:
    driver: local
  elastic_data:
    driver: local

# -----------------------------------------------------
# 🌐 Networks (Isolation & Security)
# -----------------------------------------------------
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
